<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Control Panel | TrendVibe Fashion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="admin.js" defer></script>
</head>
<body class="admin-page">
  <header class="admin-topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">TV</span>
      <span class="brand-name">TrendVibe <span>Fashion</span></span>
    </a>
    <div class="admin-topbar-title">
      <span class="eyebrow">OWNER WORKSPACE</span>
      <h1>Admin Control Panel</h1>
    </div>
    <a class="button button-outline admin-live-link" href="index.html">View Live Shop ↗</a>
  </header>

  <main class="admin-layout">
    <section class="admin-card">
      <h2 id="form-title">Add a New Product</h2>
      <form id="product-form">
        <input type="hidden" id="edit-id">
        
        <div class="form-group">
          <label for="prod-name">Product Name *</label>
          <input type="text" id="prod-name" required placeholder="e.g. Silk Anarkali Suit">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="prod-category">Category *</label>
            <select id="prod-category" required>
              <option value="Women">Women</option>
              <option value="Men">Men</option>
              <option value="Kids">Kids</option>
              <option value="Traditional / Ethnic">Traditional / Ethnic</option>
              <option value="Western">Western</option>
            </select>
          </div>
          <div class="form-group">
            <label for="prod-price">Price (₹) *</label>
            <input type="number" id="prod-price" required min="1" placeholder="1999">
          </div>
          <div class="form-group">
            <label for="prod-original-price">Original Price (₹)</label>
            <input type="number" id="prod-original-price" min="1" placeholder="2499">
          </div>
        </div>

        <div class="form-group">
          <label>Sizes Available</label>
          <div class="checkbox-group">
            <label><input type="checkbox" name="sizes" value="XS"> XS</label>
            <label><input type="checkbox" name="sizes" value="S" checked> S</label>
            <label><input type="checkbox" name="sizes" value="M" checked> M</label>
            <label><input type="checkbox" name="sizes" value="L" checked> L</label>
            <label><input type="checkbox" name="sizes" value="XL"> XL</label>
            <label><input type="checkbox" name="sizes" value="XXL"> XXL</label>
          </div>
        </div>

        <div class="form-group">
          <label for="prod-image-url">Image URL</label>
          <input type="url" id="prod-image-url" placeholder="https://images.unsplash.com/...">
        </div>

        <div class="form-group">
          <label for="prod-image-file">Or Upload Image</label>
          <input type="file" id="prod-image-file" accept="image/*">
        </div>

        <div class="form-group">
          <label for="prod-desc">Description</label>
          <textarea id="prod-desc" rows="2" placeholder="Brief details about material, fit..."></textarea>
        </div>

        <div class="form-group">
          <label><input type="checkbox" id="prod-stock" checked> In Stock</label>
        </div>

        <div class="form-actions">
          <button type="submit" class="button button-dark" id="submit-btn">Publish Product</button>
          <button type="button" class="button button-outline" id="cancel-btn" style="display:none;">Cancel Edit</button>
        </div>
      </form>
    </section>

    <section class="admin-card">
      <h2>Manage Products</h2>
      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="product-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <div class="toast"></div>
</body>
</html>
